# CPU-only maze pathfinder demo. Sentinel itself remains language-neutral.

[project]
seed_dir = ".autoresearch/project"

[agent]
provider = "codex"
model = "gpt-6-luna"
timeout_seconds = 900

[candidate]
# V1-0 is the BFS baseline; the first experiment is V1-1.
major_version = 1
minor_version = 0
editable_files = ["solver.py"]
file_prefix = "maze_pathfinder"

[workspace]
experimentation_dir = ".autoresearch/experimentation"
approved_dir = "approved"
rejected_dir = ".autoresearch/rejected"
logbook = "LOGBOOK.json"

[commands]
# No build step or external packages are required.
build = []
evaluate = ["python3", "evaluate.py"]
timeout_seconds = 300

[evaluation]
result_file = "evaluation-result.json"

[metric]
name = "total_nodes_explored"
json_path = "metrics.total_nodes_explored"
direction = "minimize"

[approval]
minimum_improvement = 0.0
